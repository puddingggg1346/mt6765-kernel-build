name: Build Mainline MT6765 Kernel with Debug

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout your config repository
      uses: actions/checkout@v4

    - name: Checkout kernel source
      run: |
        git clone --depth=1 https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git kernel

    - name: Setup build tools
      run: |
        sudo apt update
        sudo apt install -y git make gcc-aarch64-linux-gnu

    - name: Configure kernel
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        # 从你的仓库根目录复制 config.gz 过来
        cp ../config.gz .
        gunzip config.gz
        mv config .config
        
        # 开启 IPC namespace
        scripts/config --file .config -e CONFIG_IPC_NS
        
        # --- 开启所有调试选项 ---
        scripts/config --file .config -e CONFIG_DEBUG_KERNEL
        scripts/config --file .config -e CONFIG_DEBUG_INFO
        scripts/config --file .config -e CONFIG_DEBUG_FS
        scripts/config --file .config -e CONFIG_PSTORE
        scripts/config --file .config -e CONFIG_PSTORE_CONSOLE
        scripts/config --file .config -e CONFIG_PSTORE_RAM
        scripts/config --file .config -e CONFIG_RAMOOPS
        scripts/config --file .config -e CONFIG_EARLY_PRINTK
        scripts/config --file .config -e CONFIG_DYNAMIC_DEBUG
        scripts/config --file .config --set-val CONFIG_LOG_BUF_SHIFT 18
        
        make olddefconfig

    - name: Build kernel
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) Image.gz

    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: mainline-debug-kernel
        path: kernel/arch/arm64/boot/Image.gz
