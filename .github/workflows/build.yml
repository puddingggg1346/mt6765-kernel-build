name: Build Mainline Kernel for MT6765

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mainline kernel
      run: |
        git clone --depth=1 https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git kernel
        cd kernel
        git checkout v6.1  # 使用稳定的 LTS 版本

    - name: Setup build tools
      run: |
        sudo apt update
        sudo apt install -y git make gcc-aarch64-linux-gnu

    - name: Configure kernel
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        # 使用 defconfig + MT6765 相关选项
        make defconfig
        scripts/config --file .config -e CONFIG_ARCH_MEDIATEK
        scripts/config --file .config -e CONFIG_MACH_MT6765
        scripts/config --file .config -e CONFIG_IPC_NS
        # 开启必要的驱动
        scripts/config --file .config -e CONFIG_MTK_SERIAL
        scripts/config --file .config -e CONFIG_MTK_TIMER
        make olddefconfig

    - name: Build kernel
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make -j$(nproc) Image.gz dtbs

    - name: Upload kernel and device tree
      uses: actions/upload-artifact@v4
      with:
        name: kernel-and-dtbs
        path: |
          kernel/arch/arm64/boot/Image.gz
          kernel/arch/arm64/boot/dts/mediatek/*.dtb
